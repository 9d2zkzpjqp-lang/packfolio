const KEY='packfolio-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.trips))state={trips:[],active:null,recent:[],custom:[],archived:false};let tab='list';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).toLocaleLowerCase('de').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');const allLex=()=>[...SEED.lexicon,...state.custom];const known=n=>allLex().find(x=>norm(x.name)===norm(n));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const active=()=>state.trips.find(t=>t.id===state.active);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function fromTemplate(kind){let t=active();if(!t){newTrip('Meine Reise');t=active()}let rows=kind==='Wochenendtrip'?SEED.weekend.items:kind==='Kurzreise'?SEED.shorttrip.items:(SEED.sources.find(s=>s.name===kind)||{}).items||[];let count=0;for(let r of rows){let name=r.name.trim();if(!name||known(name)?.status==='archiviert')continue;if(/^(tasche|rucksack|handgepäck|kleidung|sonstiges|medikamente|dokumente|elektronik|hygiene)$/i.test(name))continue;if(/flip.?flops/i.test(name)&&!confirm('Flip-Flops nur im Sommer hinzufügen?'))continue;let old=t.items.find(x=>norm(x.name)===norm(name));if(!old){t.items.push({id:uid(),name,qty:r.quantity||1,done:false,uncertain:r.quantity==null});count++}}save();alert(count+' Einträge ergänzt. Unbekannte Mengen stehen zunächst auf 1 und sind veränderbar.')}
function render(){let t=active();$('#view-list').innerHTML=`<div class="panel hero"><div class="row spread"><div class="grow"><div class="muted">AKTUELLE REISE</div><h2 style="margin:5px 0">${esc(t?.name||'Noch keine Reise')}</h2></div><button class="secondary" onclick="tripDialog()">${t?'Wechseln':'Anlegen'}</button></div>${t?`<div class="muted">${t.items.filter(i=>i.done).length} von ${t.items.length} erledigt</div><div class="progress"><span style="width:${t.items.length?100*t.items.filter(i=>i.done).length/t.items.length:0}%"></span></div>`:'<p>Lege deine erste Packliste an.</p>'}</div><div class="panel"><h2>Schnell hinzufügen</h2><div class="toolbar"><input id="quick" placeholder="Gegenstand oder Menge …" onkeydown="if(event.key==='Enter')quickAdd()"><button onclick="quickAdd()">＋</button><button onclick="voiceDialog()" title="Diktieren">🎙</button></div><p class="muted">Auch mehrere Einträge: „3 T-Shirts und Zahnbürste und Powerbank“</p><button class="secondary" onclick="templateDialog()">＋ Aus Vorlage übernehmen</button></div>${t?`<div class="panel"><div class="row spread"><h2>Einpacken</h2><span class="pill">${t.items.length} Positionen</span></div>${t.items.length?t.items.map(i=>`<div class="item ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} onchange="updateItem('${i.id}','done',this.checked)"><div class="grow"><div class="itemname">${esc(i.name)}</div>${i.uncertain?'<span class="muted">Menge aus Vorlage nicht bekannt</span>':''}</div><div class="qty"><button class="secondary" onclick="changeQty('${i.id}',-1)">−</button><strong>${i.qty}</strong><button class="secondary" onclick="changeQty('${i.id}',1)">+</button></div><button class="ghost" onclick="removeItem('${i.id}')">×</button></div>`).join(''):'<p class="muted">Noch keine Gegenstände hinzugefügt.</p>'}</div>`:''}<div class="panel"><h2>Zuletzt verwendet</h2><div class="recent">${state.recent.filter(n=>!t?.items.some(i=>norm(i.name)===norm(n))).slice(0,14).map(n=>`<button onclick="add(${JSON.stringify('@@').replace('"@@"',`decodeURIComponent('${encodeURIComponent(n)}')`)})">＋ ${esc(n)}</button>`).join('')||'<span class="muted">Erscheint nach dem ersten Hinzufügen.</span>'}</div></div>`;
$('#view-lex').innerHTML=`<div class="panel"><h2>Gegenstandslexikon</h2><p class="muted">${allLex().length} Einträge, archivierte Gegenstände werden nicht vorgeschlagen.</p><input id="lexq" placeholder="Lexikon durchsuchen" oninput="drawLex()"><div id="lexrows"></div></div>`;$('#view-settings').innerHTML=`<div class="panel"><h2>Deine Reisen</h2>${state.trips.map(t=>`<div class="search-result"><span>${esc(t.name)} <span class="muted">(${t.items.length})</span></span><div><button class="secondary" onclick="state.active='${t.id}';save();switchTab('list')">Öffnen</button> <button class="ghost" onclick="deleteTrip('${t.id}')">×</button></div></div>`).join('')||'<p class="muted">Noch keine Reisen.</p>'}<button onclick="tripDialog()">＋ Neue Reise</button></div><div class="panel"><h2>Datensicherung</h2><p class="muted">Alles wird nur in diesem Browser gespeichert. Für andere Geräte oder zur Sicherung JSON exportieren.</p><div class="row"><button onclick="exportJSON()">JSON exportieren</button><label style="margin:0"><span class="pill">JSON importieren</span><input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></label></div></div><div class="panel"><h2>Technikhinweis</h2><p class="muted">Mikrofon benötigt Browserunterstützung und meist HTTPS. Die Spracherkennung kann Sprache an den Browseranbieter übertragen. Kein Supabase-Konto und keine Cloud-Synchronisation in V1.</p></div>`;if(tab==='lex')drawLex();}
function drawLex(){let q=norm($('#lexq')?.value||'');$('#lexrows').innerHTML=allLex().filter(x=>x.status!=='archiviert'&&(!q||norm(x.name).includes(q))).slice(0,60).map(x=>`<div class="search-result"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.category)} · ${esc(x.status)}</div></div><button class="secondary" onclick="add(decodeURIComponent('${encodeURIComponent(x.name)}'));switchTab('list')">＋</button></div>`).join('')}
function switchTab(n){tab=n;['list','lex','settings'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==n));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function updateItem(id,key,value){let i=active()?.items.find(x=>x.id===id);if(i){i[key]=value;save()}}function changeQty(id,d){let i=active()?.items.find(x=>x.id===id);if(i){i.qty=Math.max(1,i.qty+d);i.uncertain=false;save()}}function removeItem(id){active().items=active().items.filter(i=>i.id!==id);save()}function deleteTrip(id){if(!confirm('Reise wirklich löschen?'))return;state.trips=state.trips.filter(t=>t.id!==id);if(state.active===id)state.active=state.trips[0]?.id||null;save()}
function show(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function tripDialog(){show(`<h2>Reise anlegen oder wechseln</h2><input id="tripname" placeholder="z. B. Wochenende in Hamburg"><button style="margin-top:9px" onclick="createFromDialog()">Reise anlegen</button>${state.trips.map(t=>`<div class="search-result"><span>${esc(t.name)}</span><button class="secondary" onclick="state.active='${t.id}';save();closeModal()">Öffnen</button></div>`).join('')}<p><button class="ghost" onclick="closeModal()">Schließen</button></p>`)}function createFromDialog(){newTrip($('#tripname').value.trim()||'Neue Reise');closeModal()}
function templateDialog(){let opts=[{name:'Wochenendtrip',source:'Bestätigte Vorlage, 2 Nächte'},{name:'Kurzreise',source:'Bestätigte Vorlage, 3–4 Nächte'},...SEED.sources.filter(s=>!['Packliste_Wochenende','Packliste_Kurzreise'].includes(s.name)).map(s=>({name:s.name,source:'Historische Quelle – bitte prüfen'}))];show(`<h2>Vorlagen kombinieren</h2><p class="muted">Du kannst mehrere Vorlagen nacheinander hinzufügen. Gleiche Namen werden nicht doppelt angelegt. Alte Quellen können veraltete Begriffe enthalten.</p>${opts.map(o=>`<div class="search-result"><div><strong>${esc(o.name)}</strong><div class="muted">${esc(o.source)}</div></div><button class="secondary" onclick="fromTemplate(decodeURIComponent('${encodeURIComponent(o.name)}'));closeModal()">＋</button></div>`).join('')}<button class="ghost" onclick="closeModal()">Fertig</button>`)}
const words={ein:1,eine:1,einen:1,eins:1,zwei:2,drei:3,vier:4,fuenf:5,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10};function parseVoice(s){let safe=s.replace(/schnorchel\s+und\s+maske/ig,'Schnorchel & Maske');return safe.split(/\s+und\s+|[,;\n]+/i).map(raw=>{let m=raw.trim().match(/^(\d+|ein|eine|einen|eins|zwei|drei|vier|fünf|fuenf|sechs|sieben|acht|neun|zehn)\s+(?:paar\s+)?(.+)$/i);let qty=m?(Number(m[1])||words[m[1].toLowerCase()]||1):1;let name=(m?m[2]:raw).trim();let hit=known(name)||allLex().find(x=>norm(x.name)===norm(name.replace(/s$/,'')));return {name:hit?.name||name,qty}}).filter(x=>x.name)}function quickAdd(){let s=$('#quick').value;if(!s.trim())return;parseVoice(s).forEach(x=>add(x.name,x.qty));$('#quick').value=''}
let recognition=null;function voiceDialog(){show(`<h2>🎙 Spracheingabe</h2><p class="muted">Sprich zum Beispiel: „Drei T-Shirts und zwei kurze Hosen und Zahnbürste“.</p><textarea id="dictation" placeholder="Hier erscheint das Diktat; alternativ eintippen"></textarea><div class="row" style="margin-top:10px"><button onclick="startVoice()">🎙 Aufnahme starten</button><button class="secondary" onclick="previewDictation()">Erkennen</button></div><div id="preview"></div><p><button class="ghost" onclick="closeModal()">Schließen</button></p>`)}function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Diese Browser-Version bietet keine direkte Spracherkennung. Du kannst die iPhone-Diktierfunktion in das Textfeld verwenden.');return}recognition=new SR();recognition.lang='de-DE';recognition.interimResults=false;recognition.onresult=e=>{$('#dictation').value=e.results[0][0].transcript;previewDictation()};recognition.onerror=e=>alert('Spracherkennung: '+e.error);recognition.start()}
function previewDictation(){let parsed=parseVoice($('#dictation').value);$('#preview').innerHTML=`<h3>Vorschau</h3>${parsed.map((x,i)=>`<div class="row" style="margin:7px 0"><input style="width:70px" type="number" min="1" id="vq${i}" value="${x.qty}"><input id="vn${i}" value="${esc(x.name)}"></div>`).join('')}<button onclick="commitDictation(${parsed.length})">${parsed.length} Einträge übernehmen</button>`}function commitDictation(n){for(let i=0;i<n;i++)add($('#vn'+i).value,Number($('#vq'+i).value)||1);closeModal()}
function exportJSON(){let b=new Blob([JSON.stringify({format:'packfolio-backup',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Packfolio_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function importJSON(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='packfolio-backup'||!Array.isArray(obj.state?.trips))throw Error('Keine gültige Packfolio-Sicherung');if(confirm('Lokale Packlisten durch diese Sicherung ersetzen?')){state=obj.state;save()}}catch(e){alert(e.message)}}
render();</script></body></html>
